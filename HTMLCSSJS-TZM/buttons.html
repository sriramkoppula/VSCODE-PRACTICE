<!DOCTYPE html>
<html>
<head>
  <title>Buttons</title>

  <style>

    .subscribe-button{
      background-color: rgb(200, 0, 0);
      color: white;

      height: 36px;
      width: 105px;

      border: none;
      border-radius: 2px;

      cursor: pointer;

      margin-right: 8px;

      transition: background-color 0.15s;
    }

    .subscribe-button:hover{
      background-color: red;
    }

    .join-button{
      background-color: white;
      color: rgb(41, 118, 211);

      height: 36px;
      width: 62px;

      border-style: solid;
      border-width: 1px;
      border-color: rgb(41, 118, 211);

      border-radius: 2px;

      cursor: pointer;

      margin-right: 8px;

      transition: background-color 0.15s,
                  color 0.15s;
    }

    .join-button:hover{
      background-color: rgb(41, 118, 211);
      color: white;
    }

    .tweet-button{
      background-color: rgb(2, 158, 255);
      color: white;

      border: none;

      height: 36px;
      width: 74px;

      border-radius: 18px;

      font-weight: bold;
      font-size: 15px;

      cursor: pointer;

      transition: box-shadow 0.15s;
    }

    .tweet-button:hover{
      box-shadow: 5px 5px 10px rgba(0,0,0,0.2);
    }

  </style>
</head>

<body>

  <button class="subscribe-button">
    SUBSCRIBE
  </button>

  <button class="join-button">
    JOIN
  </button>

  <button class="tweet-button">
    Tweet
  </button>

</body>
</html>
